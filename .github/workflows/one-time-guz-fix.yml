name: One-time Guz spelling fix

on:
  push:
    branches:
      - fix/guz-name

permissions:
  contents: write

jobs:
  replace:
    if: "!contains(github.event.head_commit.message, '[skip guz fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/guz-name
          fetch-depth: 0

      - name: Replace Huz with Guz and rename profile slug
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Oleksandr M. Huz': 'Oleksandr M. Guz',
              'O.M. Huz': 'O.M. Guz',
              "profileSlug: 'huz'": "profileSlug: 'guz'",
              '/people/huz/': '/people/guz/',
          }

          paths = [
              Path('src/content/people/huz.md'),
              Path('src/data/journal.ts'),
              Path('src/content/departments/01-dynamics-stability.md'),
              Path('src/pages/en/management.astro'),
              Path('src/pages/en/history.astro'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('src/content/people/huz.md').rename('src/content/people/guz.md')
          PY

      - name: Commit corrected spelling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Correct Guz spelling across the website [skip guz fix]"
          git push origin HEAD:fix/guz-name
