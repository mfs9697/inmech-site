name: Apply README update for this pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-readme:
    if: github.head_ref == 'document-protected-workflow'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: document-protected-workflow

      - name: Assemble README and remove temporary helpers
        run: |
          cat .github/readme-parts/01.md \
              .github/readme-parts/02.md \
              .github/readme-parts/03.md \
              .github/readme-parts/04.md > README.md

          rm -rf .github/readme-parts
          rm -f \
            .github/workflows/prepare-readme-update.yml \
            .github/workflows/prepare-readme-update-trigger.yml \
            .github/workflows/prepare-readme-update-kick.yml \
            .github/workflows/prepare-readme-update-run.yml \
            .github/workflows/apply-readme-documentation.yml \
            .github/workflows/apply-readme-on-pr.yml \
            scripts/README_WORKFLOW_UPDATE_INSTRUCTIONS.txt \
            scripts/apply-readme-documentation.trigger \
            scripts/open-readme-pr.trigger \
            scripts/final-readme-pr.trigger

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document protected contribution workflow"
          git push origin HEAD:document-protected-workflow
