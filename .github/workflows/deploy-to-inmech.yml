name: Validate and deploy Astro site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-to-inmech.yml'
  pull_request:

concurrency:
  group: inmech-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate generated site
        run: npm run validate

  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      DEPLOY_TARGET: inmech
      INMECH_HOST: ${{ secrets.INMECH_HOST }}
      INMECH_USER: ${{ secrets.INMECH_USER }}
      INMECH_PATH: ${{ secrets.INMECH_PATH }}
      INMECH_PORT: ${{ secrets.INMECH_PORT }}
      DEPLOY_KEY: ${{ secrets.INMECH_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check news-only contributor changes
        run: node .github/scripts/check-news-only-changes.mjs
        env:
          NEWS_ONLY_ACTORS: ${{ vars.NEWS_ONLY_ACTORS }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate generated site
        run: npm run validate

      - name: Prepare SSH key
        run: |
          : "${INMECH_HOST:?Missing secret INMECH_HOST}"
          : "${INMECH_USER:?Missing secret INMECH_USER}"
          : "${INMECH_PATH:?Missing secret INMECH_PATH}"
          : "${DEPLOY_KEY:?Missing deploy key}"

          PORT="${INMECH_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/inmech_deploy_key
          chmod 600 ~/.ssh/inmech_deploy_key
          ssh-keyscan -p "$PORT" "$INMECH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dist to server
        run: |
          PORT="${INMECH_PORT:-22}"

          rsync -az --delete-delay --delay-updates \
            -e "ssh -i ~/.ssh/inmech_deploy_key -p $PORT" \
            ./dist/ \
            "$INMECH_USER@$INMECH_HOST:$INMECH_PATH/"
