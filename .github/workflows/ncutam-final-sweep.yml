name: NCUTAM final browser sweep

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/ncutam-wp6-infrastructure
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project and browser audit tools
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright axe-core
          npx playwright install chromium

      - name: Build site
        run: npm run build

      - name: Sweep all NCUTAM routes at desktop and mobile widths
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/ncutam-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > .ncutam-sweep.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { chromium } from 'playwright';

          const require = createRequire(import.meta.url);
          const axePath = require.resolve('axe-core/axe.min.js');
          const root = process.cwd();
          const dist = path.join(root, 'dist');
          const baseUrl = 'http://127.0.0.1:4173';
          const issues = [];
          const warnings = [];

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const files = [
            ...walk(path.join(dist, 'ncutam')),
            ...walk(path.join(dist, 'en', 'ncutam'))
          ].filter((file) => file.endsWith('index.html'));

          const routes = files.map((file) => {
            const rel = path.relative(dist, file).replaceAll(path.sep, '/').replace(/index\.html$/, '');
            return `/${rel}`;
          }).sort();

          const viewports = [
            { name: 'desktop', width: 1440, height: 900 },
            { name: 'mobile', width: 390, height: 844 }
          ];

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              for (const route of routes) {
                const page = await context.newPage();
                const response = await page.goto(`${baseUrl}${route}`, { waitUntil: 'networkidle' });
                if (!response || !response.ok()) {
                  issues.push(`${viewport.name} ${route}: HTTP ${response?.status() ?? 'no response'}`);
                  await page.close();
                  continue;
                }

                const audit = await page.evaluate(() => {
                  const html = document.documentElement;
                  const ids = [...document.querySelectorAll('[id]')].map((el) => el.id);
                  const duplicateIds = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
                  const blankRel = [...document.querySelectorAll('a[target="_blank"]')]
                    .filter((a) => !/\bnoopener\b/.test(a.getAttribute('rel') ?? ''))
                    .map((a) => a.getAttribute('href'));
                  const brokenImages = [...document.images]
                    .filter((img) => img.complete && img.naturalWidth === 0)
                    .map((img) => img.getAttribute('src'));
                  const emptyAlt = [...document.images]
                    .filter((img) => !img.hasAttribute('alt') || img.getAttribute('alt') === '')
                    .map((img) => img.getAttribute('src'));
                  const text = document.body.innerText;
                  const placeholder = /(буде перенесено|підготовлено до міграції|content-import batch|will be migrated|ready for content migration)/i.test(text);
                  return {
                    overflow: html.scrollWidth - html.clientWidth,
                    h1Count: document.querySelectorAll('h1').length,
                    duplicateIds,
                    blankRel,
                    brokenImages,
                    emptyAlt,
                    placeholder
                  };
                });

                if (audit.overflow > 2) issues.push(`${viewport.name} ${route}: horizontal page overflow ${audit.overflow}px`);
                if (audit.h1Count !== 1) issues.push(`${viewport.name} ${route}: expected 1 h1, found ${audit.h1Count}`);
                if (audit.duplicateIds.length) issues.push(`${viewport.name} ${route}: duplicate ids ${audit.duplicateIds.join(', ')}`);
                if (audit.blankRel.length) issues.push(`${viewport.name} ${route}: target=_blank links missing noopener (${audit.blankRel.join(', ')})`);
                if (audit.brokenImages.length) issues.push(`${viewport.name} ${route}: broken images (${audit.brokenImages.join(', ')})`);
                if (audit.emptyAlt.length) issues.push(`${viewport.name} ${route}: images missing meaningful alt (${audit.emptyAlt.join(', ')})`);
                if (audit.placeholder) issues.push(`${viewport.name} ${route}: stale migration placeholder visible`);

                await page.addScriptTag({ path: axePath });
                const axe = await page.evaluate(async () => {
                  const result = await globalThis.axe.run(document, {
                    runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'] }
                  });
                  return result.violations.map((v) => ({
                    id: v.id,
                    impact: v.impact,
                    help: v.help,
                    targets: v.nodes.slice(0, 4).map((n) => n.target.join(' '))
                  }));
                });
                for (const violation of axe) {
                  const line = `${viewport.name} ${route}: axe ${violation.impact ?? 'unknown'} ${violation.id} — ${violation.help} [${violation.targets.join('; ')}]`;
                  if (violation.impact === 'critical' || violation.impact === 'serious') issues.push(line);
                  else warnings.push(line);
                }
                await page.close();
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }

          console.log(`NCUTAM browser sweep checked ${routes.length} routes at ${viewports.length} viewport sizes (${routes.length * viewports.length} page renders).`);
          if (warnings.length) {
            console.log(`Non-blocking accessibility observations (${warnings.length}):`);
            for (const warning of warnings) console.log(`  - ${warning}`);
          }
          if (issues.length) {
            console.error(`Blocking sweep findings (${issues.length}):`);
            for (const issue of issues) console.error(`  - ${issue}`);
            process.exit(1);
          }
          console.log('NCUTAM final browser sweep passed with no blocking visual/mobile/content/accessibility findings.');
          EOF
          node .ncutam-sweep.mjs

      - name: Remove one-shot sweep workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ncutam-final-sweep.yml
          git commit -m "Remove one-shot NCUTAM browser sweep"
          git push origin HEAD:feat/ncutam-wp6-infrastructure
