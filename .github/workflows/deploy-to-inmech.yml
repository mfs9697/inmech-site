name: Validate and deploy Astro site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-to-inmech.yml'
  pull_request:

concurrency:
  group: inmech-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate generated site
        run: npm run validate

  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      DEPLOY_TARGET: inmech
      INMECH_HOST: ${{ secrets.INMECH_HOST }}
      INMECH_USER: ${{ secrets.INMECH_USER }}
      INMECH_PATH: ${{ secrets.INMECH_PATH }}
      INMECH_PORT: ${{ secrets.INMECH_PORT }}
      DEPLOY_KEY: ${{ secrets.INMECH_SSH_PRIVATE_KEY }}
      INMECH_SITE_URL: ${{ vars.INMECH_SITE_URL || 'https://new.inmech.kyiv.ua' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check news-only contributor changes
        run: node .github/scripts/check-news-only-changes.mjs
        env:
          NEWS_ONLY_ACTORS: ${{ vars.NEWS_ONLY_ACTORS }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate generated site
        run: npm run validate

      - name: Write deployment marker
        run: printf '%s' "$GITHUB_SHA" > dist/deploy-version.txt

      - name: Prepare SSH key
        run: |
          : "${INMECH_HOST:?Missing secret INMECH_HOST}"
          : "${INMECH_USER:?Missing secret INMECH_USER}"
          : "${INMECH_PATH:?Missing secret INMECH_PATH}"
          : "${DEPLOY_KEY:?Missing deploy key}"

          PORT="${INMECH_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/inmech_deploy_key
          chmod 600 ~/.ssh/inmech_deploy_key
          ssh-keyscan -p "$PORT" "$INMECH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dist to server
        run: |
          PORT="${INMECH_PORT:-22}"

          rsync -az --delete-delay --delay-updates \
            -e "ssh -i ~/.ssh/inmech_deploy_key -p $PORT" \
            ./dist/ \
            "$INMECH_USER@$INMECH_HOST:$INMECH_PATH/"

      - name: Verify public deployment
        run: |
          PUBLIC_SITE_URL="${INMECH_SITE_URL:-https://new.inmech.kyiv.ua}"
          PUBLIC_SITE_URL="${PUBLIC_SITE_URL%/}"
          MARKER_URL="$PUBLIC_SITE_URL/deploy-version.txt"
          MARKER_BODY="$(mktemp)"
          LAST_STATUS="not requested"
          LAST_MARKER=""

          for attempt in $(seq 1 10); do
            LAST_STATUS="$(
              curl -sS -L --max-time 20 \
                -H "Cache-Control: no-cache" \
                -H "Pragma: no-cache" \
                -o "$MARKER_BODY" \
                -w "%{http_code}" \
                "$MARKER_URL" || true
            )"

            if [ "$LAST_STATUS" = "200" ]; then
              LAST_MARKER="$(cat "$MARKER_BODY")"
              if [ "$LAST_MARKER" = "$GITHUB_SHA" ]; then
                echo "Deployment marker verified at $MARKER_URL."
                break
              fi
            fi

            echo "Deployment marker is not current yet at $MARKER_URL (attempt $attempt/10, HTTP $LAST_STATUS)."
            sleep 6
          done

          if [ "$LAST_STATUS" != "200" ]; then
            echo "::error::Deployment marker did not become available at $MARKER_URL after 10 attempts. Last HTTP status: $LAST_STATUS."
            exit 1
          fi

          if [ "$LAST_MARKER" != "$GITHUB_SHA" ]; then
            echo "::error::Deployment marker mismatch at $MARKER_URL. Expected $GITHUB_SHA but received ${LAST_MARKER:-<empty>}."
            exit 1
          fi

          for path in "/" "/en/" "/vacancies/" "/en/vacancies/" "/sitemap-index.xml"; do
            SMOKE_BODY="$(mktemp)"
            SMOKE_URL="$PUBLIC_SITE_URL$path?deploy-check=$GITHUB_SHA"
            STATUS="$(
              curl -sS -L --max-time 20 \
                -H "Cache-Control: no-cache" \
                -H "Pragma: no-cache" \
                -o "$SMOKE_BODY" \
                -w "%{http_code}" \
                "$SMOKE_URL" || true
            )"

            case "$STATUS" in
              2*|3*)
                echo "Smoke check passed for $path (HTTP $STATUS)."
                ;;
              *)
                echo "::error::Smoke check failed for $path with HTTP status $STATUS."
                rm -f "$SMOKE_BODY"
                exit 1
                ;;
            esac

            case "$path" in
              "/")
                if ! grep -q '<html lang="uk"' "$SMOKE_BODY" || ! grep -q 'href="/vacancies/"' "$SMOKE_BODY"; then
                  echo "::error::Smoke check for / did not find expected generated Ukrainian home page content."
                  rm -f "$SMOKE_BODY"
                  exit 1
                fi
                ;;
              "/en/")
                if ! grep -q '<html lang="en"' "$SMOKE_BODY" || ! grep -q 'href="/en/vacancies/"' "$SMOKE_BODY"; then
                  echo "::error::Smoke check for /en/ did not find expected generated English home page content."
                  rm -f "$SMOKE_BODY"
                  exit 1
                fi
                ;;
            esac

            rm -f "$SMOKE_BODY"
          done
