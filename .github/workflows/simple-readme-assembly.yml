name: Simple README assembly

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    if: github.head_ref == 'document-protected-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: document-protected-workflow
      - run: |
          cat .github/readme-parts/01.md .github/readme-parts/02.md .github/readme-parts/03.md .github/readme-parts/04.md > README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document protected contribution workflow"
          git push origin HEAD:document-protected-workflow
