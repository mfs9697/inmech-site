name: Synchronize npm lockfile

on:
  push:
    branches:
      - chore/reproducible-npm-builds
    paths:
      - '.github/workflows/sync-package-lock.yml'

permissions:
  contents: write

jobs:
  synchronize-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify locked install
        run: npm ci

      - name: Verify Astro build
        run: npm run build

      - name: Commit synchronized lockfile
        run: |
          rm .github/workflows/sync-package-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/sync-package-lock.yml
          git commit -m "Synchronize npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
