name: Postdoc mobile visual regression

on:
  pull_request:
    paths:
      - 'src/pages/vacancies.astro'
      - 'src/pages/en/vacancies.astro'
      - 'src/pages/documents/postdoc/**'
      - 'src/data/vacancies*.ts'
      - 'scripts/check-postdoc-mobile.mjs'
      - '.github/workflows/postdoc-mobile-visual.yml'

concurrency:
  group: postdoc-mobile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium-viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked site dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Install temporary Playwright for CI-only emulation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'Using preinstalled Google Chrome on GitHub runner'
          else
            echo 'No preinstalled Chrome; installing Playwright headless Chromium'
            npx playwright install chromium --only-shell
          fi
      - name: Test phone, tablet and desktop viewports
        run: node scripts/check-postdoc-mobile.mjs
      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdoc-chromium-viewports
          path: artifacts/postdoc-mobile/
          if-no-files-found: warn
          retention-days: 14
