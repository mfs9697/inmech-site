name: NCUTAM one-shot PDF migration

on:
  push:
    branches:
      - feat/ncutam-wp6-infrastructure
    paths:
      - '.github/workflows/ncutam-pdf-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Stage NCUTAM PDF migration workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch verified legacy binaries
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mfs9697/ncutam.git /tmp/ncutam-legacy

          mkdir -p public/documents/ncutam/foundation/1992
          mkdir -p public/documents/ncutam/foundation/1993
          mkdir -p public/documents/ncutam/governance/1992
          mkdir -p public/documents/ncutam/governance/2024
          mkdir -p public/documents/ncutam/reports/2023
          mkdir -p public/documents/ncutam/reports/2024
          mkdir -p public/documents/ncutam/reports/2025

          cp '/tmp/ncutam-legacy/media/files/Постанова про створення Комітету.pdf' \
            public/documents/ncutam/foundation/1992/ncutam-founding-resolution-1992.pdf
          cp '/tmp/ncutam-legacy/media/files/Статут Комітету.pdf' \
            public/documents/ncutam/foundation/1993/ncutam-statute-1993.pdf
          cp '/tmp/ncutam-legacy/media/files/Положення про Комітет.pdf' \
            public/documents/ncutam/governance/1992/ncutam-regulation-1992.pdf
          cp '/tmp/ncutam-legacy/media/files/Звіт НКУТПМ 2023.pdf' \
            public/documents/ncutam/reports/2023/ncutam-report-2023.pdf
          cp '/tmp/ncutam-legacy/media/files/Звіт НКУТПМ 2024.pdf' \
            public/documents/ncutam/reports/2024/ncutam-report-2024.pdf
          cp '/tmp/ncutam-legacy/media/files/Звіт НКУТПМ 2025.pdf' \
            public/documents/ncutam/reports/2025/ncutam-report-2025.pdf

      - name: Recover exact Drive Resolution 26 upload
        run: |
          set -euo pipefail
          SOURCE='public/documents/public/ncutam/governance/2024/nasu-resolution-26-2024-01-24.pdf'
          TARGET='public/documents/ncutam/governance/2024/nasu-resolution-26-2024-01-24.pdf'
          EXPECTED='f1a654c405729eac9fc09e16095e89c7f8ac1e01'

          test -f "$SOURCE"
          if [ "$(git hash-object "$SOURCE")" = "$EXPECTED" ]; then
            cp "$SOURCE" "$TARGET"
          elif [ "$(stat -c%s "$SOURCE")" = '184548' ]; then
            head -c 184546 "$SOURCE" > "$TARGET"
            if [ "$(git hash-object "$TARGET")" != "$EXPECTED" ]; then
              echo '::error::The uploaded Resolution No. 26 differs from the authoritative Drive PDF by more than two trailing bytes.'
              rm -f "$TARGET"
              exit 1
            fi
            echo 'Recovered the authoritative Resolution No. 26 by removing exactly two trailing bytes.'
          else
            echo '::error::Unexpected Resolution No. 26 size/hash.'
            exit 1
          fi

          rm -rf public/documents/public

      - name: Verify all seven Git blob hashes
        run: |
          set -euo pipefail
          check() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file hash mismatch: expected $expected, got $actual"
              exit 1
            fi
            printf 'verified %s  %s\n' "$actual" "$file"
          }

          check public/documents/ncutam/foundation/1992/ncutam-founding-resolution-1992.pdf c6ef5b54fd05219f2983c4803b810cff8c4b25f5
          check public/documents/ncutam/foundation/1993/ncutam-statute-1993.pdf dbac09390c4798158adb3c59210d0f8c2a6250a4
          check public/documents/ncutam/governance/1992/ncutam-regulation-1992.pdf 804ebdf4cc65496ea92b48013b6496c4b689a8ec
          check public/documents/ncutam/governance/2024/nasu-resolution-26-2024-01-24.pdf f1a654c405729eac9fc09e16095e89c7f8ac1e01
          check public/documents/ncutam/reports/2023/ncutam-report-2023.pdf 3dc4784be34c19506a0181b438004897b7c6cc84
          check public/documents/ncutam/reports/2024/ncutam-report-2024.pdf abfadd228fb3a4394d1c17b0ca263eb63a61a378
          check public/documents/ncutam/reports/2025/ncutam-report-2025.pdf 41be7ec560e69b9dc74eabebaceac70dfffe13ca

      - name: Commit migrated PDFs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/documents
          git commit -m 'Migrate verified NCUTAM PDF archive'
          git push origin HEAD:feat/ncutam-wp6-infrastructure
