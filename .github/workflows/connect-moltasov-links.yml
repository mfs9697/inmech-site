name: Connect Moltasov links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-moltasov-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch dissertations page
        run: |
          python <<'PY'
          from pathlib import Path

          page = Path('src/pages/dissertations.astro')
          text = page.read_text(encoding='utf-8')

          old = """    links: [],
    opponents: []
  },"""
          new = """    links: [
      ['Автореферат', '/inmech-site/documents/dissertations/2026/02/abstract.pdf'],
      ['Дисертація', '/inmech-site/documents/dissertations/2026/02/dissertation.pdf'],
      ['Висновок', '/inmech-site/documents/dissertations/2026/02/conclusion.pdf']
    ],
    opponents: []
  },"""

          if old not in text:
              raise SystemExit('Target Moltasov links placeholder not found')

          text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/connect-moltasov-links.yml')
          workflow.unlink(missing_ok=True)
          PY
      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dissertations.astro .github/workflows/connect-moltasov-links.yml
          git commit -m "Connect Moltasov defense documents"
          git push
