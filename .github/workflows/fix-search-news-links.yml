name: Fix search news links

on:
  push:
    branches:
      - fix-search-news-links
    paths:
      - '.github/workflows/fix-search-news-links.yml'

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Update search news URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          helper_old = "const withBase = (path: string) => `${base}${path.startsWith('/') ? path : `/${path}`}`;"
          helper_new = """function withBase(path: string) {
            if (/^(https?:)?\\/\\//.test(path) || path.startsWith('mailto:') || path.startsWith('#')) {
              return path;
            }

            return `${base}${path.startsWith('/') ? path : `/${path}`}`;
          }"""

          changes = {
            Path('src/pages/search.astro'): (
              "  url: `/news/`,",
              "  url: entry.data.externalUrl ?? `/news/${entry.id}/`,"
            ),
            Path('src/pages/en/search.astro'): (
              "  url: `/en/news/`,",
              "  url: entry.data.externalUrl ?? `/en/news/${entry.id}/`,"
            ),
          }

          for path, (url_old, url_new) in changes.items():
            text = path.read_text(encoding='utf-8')
            if helper_old not in text:
              raise SystemExit(f'Missing expected withBase helper in {path}')
            if url_old not in text:
              raise SystemExit(f'Missing expected news URL in {path}')
            text = text.replace(helper_old, helper_new, 1)
            text = text.replace(url_old, url_new, 1)
            path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify search URL changes
        run: |
          grep -F 'entry.data.externalUrl ?? `/news/${entry.id}/`' src/pages/search.astro
          grep -F 'entry.data.externalUrl ?? `/en/news/${entry.id}/`' src/pages/en/search.astro

      - name: Commit verified changes
        run: |
          rm .github/workflows/fix-search-news-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/search.astro src/pages/en/search.astro .github/workflows/fix-search-news-links.yml
          git commit -m "Fix individual news links in site search"
          git push origin "HEAD:${GITHUB_REF_NAME}"
